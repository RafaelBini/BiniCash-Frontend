<h2 mat-dialog-title>Palavras-chave — Renda passiva</h2>
<mat-dialog-content>
    <p class="hint">Créditos cujo texto (descrição ou extrato) contiver alguma palavra-chave são classificados como renda passiva.</p>
    <div class="add_row">
        <input [(ngModel)]="newKeyword" (keyup.enter)="addKeyword()" class="default_input" placeholder="Nova palavra-chave" />
        <button mat-button class="default_button" (click)="addKeyword()">Adicionar</button>
    </div>
    <div *ngIf="isLoading">Carregando...</div>
    <div *ngFor="let row of keywords" class="keyword_row">
        <input [(ngModel)]="row.keyword" (change)="saveKeyword(row)" class="default_input" />
        <button mat-icon-button (click)="deleteKeyword(row)">
            <mat-icon>delete</mat-icon>
        </button>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Fechar</button>
</mat-dialog-actions>
